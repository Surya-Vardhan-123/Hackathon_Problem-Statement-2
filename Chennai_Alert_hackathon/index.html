<!DOCTYPE html>
<html lang="en">
<head>   
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ChennaiAlert — Tourist Crisis Companion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script>window.__chennaiAlertSharedEndpoint = '/.netlify/functions';</script>
<script src="js/leaflet-load.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="row1">
      <div id="logo"><span class="ms" aria-hidden="true">fmd_bad</span></div>
      <h1>ChennaiAlert<small id="tTitleSub">Tourist crisis companion</small></h1>
      <select id="langSel" aria-label="Language">
        <option value="en">English</option>
        <option value="ta">தமிழ்</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>
    <div id="wxRow">
      <span class="ms" id="wxIcon" aria-hidden="true">wb_sunny</span>
      <span id="wxText">Chennai · fetching live weather…</span>
      <span id="wxDot"></span>
    </div>
  </header>

  <div id="statusCard" class="ok" role="status">
    <span id="scIcon" class="ok"><span class="ms" aria-hidden="true">check_circle</span></span>
    <span id="scText">Loading live map…</span>
  </div>

  <div id="map" aria-label="Live crisis map of Chennai"></div>

  <div id="fabs">
    <button class="fab" id="fabZones" title="Toggle safe-shelter markers"><span class="ms" aria-hidden="true">local_hospital</span></button>
    <button class="fab" id="fabNearest" title="Find nearest safe place"><span class="ms" aria-hidden="true">near_me</span></button>
    <button class="fab" id="fabLocate" title="Show my location"><span class="ms" aria-hidden="true">my_location</span></button>
    <button class="fab primary" id="fabReport" title="Report a hazard"><span class="ms" aria-hidden="true">emergency</span></button>
  </div>

  <section id="sheet" aria-live="polite">
    <div class="grab"></div>
    <div id="sheetBody"></div>
  </section>
</div>

<div id="emgWrap" role="alertdialog" aria-modal="true">
  <div id="emgCard">
    <div id="emgHead"><span class="ms" aria-hidden="true">emergency</span><b id="emgTitle">EMERGENCY ZONE</b></div>
    <div id="emgBody"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="js/translations.js"></script>
<script src="js/config.js"></script>
<script src="js/shelters.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/zones.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/weather.js"></script>
<script src="js/app.js"></script>
</body>
</html>
